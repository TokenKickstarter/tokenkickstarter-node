events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name signal.tokenkickstarter.com;

        # Route WebRTC Signaling WebSockets to Node.js Docker container
        location /ws {
            # Use the Docker Compose service name 'cipher-signal-server'
            proxy_pass http://cipher-signal-server:4003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Route Text Message Relay REST API to Rust backend on the VPS host
        location /relay {
            # host.docker.internal routes to the host machine's localhost (where Rust listens on 4002)
            proxy_pass http://host.docker.internal:4002/relay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Disable caching for real-time polling
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }
}
