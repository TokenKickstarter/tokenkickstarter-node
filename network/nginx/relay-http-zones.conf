# Global Nginx http {} block include for Cipher relay edge defense (Layer 5).
# Include this inside `/www/server/nginx/conf/nginx.conf` (inside `http { ... }`):
#   include /www/server/nginx/conf/conf.d/relay-http-zones.conf;
#
# Aggregates IPv4 clients into /24 prefixes and IPv6 clients into /64 prefixes so
# distributed multi-IP botnets in the same residential/cloud subnet share throttles.

map $remote_addr $cipher_subnet_key {
    default                                $remote_addr;
    "~^(?P<v4>\d+\.\d+\.\d+)\.\d+$"        "${v4}.0/24";
    "~^(?P<v6>[0-9a-fA-F:]+:[0-9a-fA-F:]+):[0-9a-fA-F]*:[0-9a-fA-F]*$" "${v6}::/64";
}

# Edge rate limits:
# - /store & /store/batch throttled per /24 or /64 subnet (20 req/s steady, burst 40)
# - General relay/fetch/ack per client IP (40 req/s steady, burst 80)
# - WebSocket concurrent connections capped per /24 or /64 subnet (64 sockets)
limit_req_zone  $cipher_subnet_key  zone=cipher_store_subnet:20m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=cipher_relay_ip:20m      rate=40r/s;
limit_conn_zone $cipher_subnet_key  zone=cipher_ws_subnet:10m;
limit_req_status 429;
limit_conn_status 429;
