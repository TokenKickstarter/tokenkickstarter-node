# Optional nginx map (often fails for POST JSON body timing on aaPanel).
# Prefer PHP gateway: network/php/rpc-gateway.php + README-aapanel-rpc.md
#
# Include inside http { } when using nginx map + if in location (not server tail).
map $request_body $tks_deny_identity_rpc {
    default 0;
    ~*"method"\s*:\s*"system_localPeerId" 1;
    ~*"method"\s*:\s*"system_localListenAddresses" 1;
    ~*"method"\s*:\s*"system_peers" 1;
    ~*"method"\s*:\s*"system_unstable_networkState" 1;
}
