# Include inside the server { } block that fronts https://rpc.tokenkickstarter.com
# Deny JSON-RPC methods that expose P2P identity (node still accepts them on 127.0.0.1:9944).
map $request_body $tks_deny_identity_rpc {
    default 0;
    ~*"method"\s*:\s*"system_localPeerId" 1;
    ~*"method"\s*:\s*"system_localListenAddresses" 1;
    ~*"method"\s*:\s*"system_peers" 1;
    ~*"method"\s*:\s*"system_unstable_networkState" 1;
}
