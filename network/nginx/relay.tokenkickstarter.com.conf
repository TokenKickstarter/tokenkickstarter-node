# nginx — relay.tokenkickstarter.com → cipher-relay on host :4002 & signal :4003
# Mobile/CLI clients POST /store, /store/batch, /fetch, /ack (no long buffering).
# aaPanel: paste into the site extension include (`location` directives inside `server {}`).
#
# Layer 5 Subnet Throttling (recommended in production):
#   1. Include `relay-http-zones.conf` inside global `http {}`.
#   2. Uncomment the `limit_req` and `limit_conn` lines below in /store, /store/batch, /ws, and /.

location = /internal/push {
    deny all;
    return 403;
}

location = /ingest {
    deny all;
    return 403;
}

location = /stats {
    deny all;
    return 403;
}

location = /hybrid/stats {
    deny all;
    return 403;
}

location ^~ /ws {
    # limit_conn cipher_ws_subnet 64;
    proxy_pass http://127.0.0.1:4003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
}

location = /store {
    # limit_req zone=cipher_store_subnet burst=40 nodelay;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:4002/store;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

location = /store/batch {
    # limit_req zone=cipher_store_subnet burst=20 nodelay;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:4002/store/batch;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

location ^~ /signal/push {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:4002/signal/push;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

location / {
    # limit_req zone=cipher_relay_ip burst=80 nodelay;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:4002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering on;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}
