[package]
name = "cipher-shard-executor"
version = "0.1.1"
edition = "2021"
description = "Cipher HyperSwarm shard executor — batch messages, DA blobs, L1 anchor payloads (M2)"

[lib]
name = "cipher_shard_executor"
path = "src/lib.rs"

[[bin]]
name = "cipher-shard-executor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
