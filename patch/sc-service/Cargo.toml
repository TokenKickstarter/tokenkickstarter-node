[package]
name = "sc-service"
version = "0.56.0"
authors = ["TokenKickstarter <dev@tokenkickstarter.com>"]
edition = "2021"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
description = "Substrate service (TKS-patched gen_rpc_module)"

[dependencies]
async-trait = { version = "0.1.88" }
codec = { package = "parity-scale-codec", version = "3.6", default-features = true, features = ["derive"] }
directories = { version = "5.0.1" }
exit-future = { version = "0.2.0" }
futures = { version = "0.3" }
futures-timer = { version = "3.0.2" }
jsonrpsee = { version = "0.24", default-features = true, features = ["server"] }
log = { version = "0.4", default-features = true }
parking_lot = { version = "0.12.1", default-features = true }
pin-project = { version = "1.1.3" }
rand = { version = "0.8.5", default-features = true }
schnellru = { version = "0.2.3" }
serde = { version = "1.0", default-features = true, features = ["derive"] }
serde_json = { version = "1.0", default-features = true }
static_init = { version = "1.0.4" }
tempfile = { version = "3.10" }
thiserror = { version = "1.0" }
tokio = { version = "1.40", default-features = true, features = ["parking_lot", "rt-multi-thread", "time"] }
tracing = { version = "0.1", default-features = true }
tracing-futures = { version = "0.2" }
sc-chain-spec = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-client-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-client-db = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-consensus = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-executor = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-informant = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-keystore = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-network = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-network-common = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-network-light = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-network-sync = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-network-transactions = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-network-types = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-rpc = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-rpc-server = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-rpc-spec-v2 = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-sysinfo = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-telemetry = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-tracing = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-transaction-pool-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sc-utils = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-blockchain = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-consensus = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-externalities = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-keystore = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-session = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-state-machine = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-storage = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-transaction-storage-proof = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-trie = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }
prometheus-endpoint = { package = "substrate-prometheus-endpoint", git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2512", default-features = true }

[features]
default = ["rocksdb"]
rocksdb = ["sc-client-db/rocksdb"]
runtime-benchmarks = ["sc-client-db/runtime-benchmarks", "sp-runtime/runtime-benchmarks"]
jemalloc-allocator = ["sc-client-db/jemalloc-allocator"]
