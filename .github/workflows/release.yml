name: TKS Node Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.5.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── macOS: Apple Silicon + Intel ─────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
          components: rust-src

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-v2-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-${{ matrix.target }}-

      - name: Install system dependencies
        run: |
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install protobuf llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "LIBCLANG_PATH=${LLVM_PREFIX}/lib" >> $GITHUB_ENV
          echo "LDFLAGS=-L${LLVM_PREFIX}/lib" >> $GITHUB_ENV
          echo "${LLVM_PREFIX}/bin" >> $GITHUB_PATH

      - name: Build
        env:
          WASM_BUILD_RUSTFLAGS: "-C link-arg=--allow-undefined"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
          cp target/${{ matrix.target }}/release/tks-chain-node \
             tks-chain-node-${VERSION}-macos-${{ matrix.arch }}
          chmod +x tks-chain-node-${VERSION}-macos-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: tks-chain-node-*

  # ── Linux: x86_64 + ARM64 (native runners — no cross-compilation) ──
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            clang libclang-dev protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
          components: rust-src

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-v3-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-v3-${{ matrix.target }}-

      - name: Build
        env:
          WASM_BUILD_RUSTFLAGS: "-C link-arg=--allow-undefined"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
          cp target/${{ matrix.target }}/release/tks-chain-node \
             tks-chain-node-${VERSION}-linux-${{ matrix.arch }}
          chmod +x tks-chain-node-${VERSION}-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: tks-chain-node-*

  # ── Windows: x86_64 ──────────────────────────────────────────────
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-v3-amd64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-v3-amd64-

      - name: Install LLVM/Clang (required by rocksdb)
        run: choco install llvm -y
        shell: powershell

      - name: Install protoc (Windows)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: cargo build --release
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
          WASM_BUILD_RUSTFLAGS: "-C link-arg=--allow-undefined"

      - name: Package binary
        shell: bash
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
          cp target/release/tks-chain-node.exe \
             tks-chain-node-${VERSION}-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: tks-chain-node-*.exe

  # ── Create GitHub Release ─────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;

          # Copy network scripts
          cp network/start-node.sh       release-files/
          cp network/start-node.bat      release-files/
          cp network/start-validator.sh  release-files/
          cp network/start-bootnode.sh   release-files/
          cp network/inject-validator-keys.sh release-files/
          cp network/purge-chain.sh      release-files/
          cp network/install.sh          release-files/
          cp network/server-setup.sh     release-files/
          cp network/tks-node.service    release-files/
          cp network/tks-bootnode.service release-files/
          cp network/README.md           release-files/
          chmod +x release-files/*.sh

          ls -lh release-files/

      - name: Install Rust (for chainspec)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install system deps for chainspec build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev clang libclang-dev protobuf-compiler

      - name: Build native binary for chainspec generation
        env:
          WASM_BUILD_RUSTFLAGS: "-C link-arg=--allow-undefined"
        run: cargo build --release

      - name: Generate chainspec files
        run: |
          # Dev/local reference (Alice/Bob)
          ./target/release/tks-chain-node \
            build-spec --chain=local > release-files/tks-testnet-spec.json
          ./target/release/tks-chain-node \
            build-spec --chain=release-files/tks-testnet-spec.json --raw \
            > release-files/tks-testnet-spec-raw.json
          # Production template (Live TKS Network — fill bootNodes via assemble script)
          cp network/tks-network-spec.template.json release-files/tks-network-spec.template.json
          cp network/genesis-summary.public.example.json release-files/genesis-summary.public.example.json
          cp network/GENESIS-ALLOCATION.public.md release-files/GENESIS-ALLOCATION.public.md
          cp network/SUDO-MULTISIG.public.md release-files/SUDO-MULTISIG.public.md
          # Live production raw spec (spec 412) when operator publishes via publish-production-chainspec.sh
          if [ -f network/tks-network-spec-raw.json ]; then
            cp network/tks-network-spec-raw.json release-files/tks-network-spec-raw.json
          fi
          if [ -f network/tks-network-spec-raw.sha256 ]; then
            cp network/tks-network-spec-raw.sha256 release-files/tks-network-spec-raw.sha256
          fi
          echo "Chainspec generated"

      - name: Reject production secrets in release bundle
        run: |
          if find release-files -name '*production-keys*' | grep -q .; then
            echo "production-keys must not ship in releases"
            exit 1
          fi
          # Match embedded secret values in JSON, not ops scripts that read JSON field names.
          if grep -rE '"secretSeed"\s*:\s*"[^"]+"' release-files --include='*.json' 2>/dev/null; then
            echo "Release JSON contains secretSeed values"
            exit 1
          fi
          if grep -rE '"secretPhrase"\s*:\s*"[^"]+"' release-files --include='*.json' 2>/dev/null; then
            echo "Release JSON contains secretPhrase values"
            exit 1
          fi
          if grep -rE 'BEGIN OPENSSH PRIVATE KEY' release-files 2>/dev/null; then
            echo "Release files contain SSH private keys"
            exit 1
          fi

      - name: Generate SHA256 checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build release notes from RELEASE_NOTES.md
        run: |
          chmod +x .github/scripts/build-release-body.sh
          .github/scripts/build-release-body.sh "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TKS Node ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          body_path: release-body.md
          files: release-files/*
          draft: false
          prerelease: false
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
